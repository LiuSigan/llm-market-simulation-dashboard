<!doctype html><html lang='zh-CN'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>LLM Market Lab</title><style>body{font:16px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;max-width:1000px;margin:32px auto;padding:0 20px;background:#f5f7fb;color:#17212b}section{background:#fff;border:1px solid #dce3eb;border-radius:12px;padding:20px;margin:16px 0}label{display:inline-block;margin:8px}input,select,button{font:inherit;padding:8px}button{background:#1463d6;color:white;border:0;border-radius:7px;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border:1px solid #dce3eb;border-radius:8px;padding:14px}pre{white-space:pre-wrap;line-height:1.65}.bar{height:10px;background:#e5eaf1;border-radius:8px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:#1463d6;width:0%;transition:width .4s}.spin{display:inline-block;width:14px;height:14px;border:2px solid #c9d8f4;border-top-color:#1463d6;border-radius:50%;animation:turn 1s linear infinite;vertical-align:-2px}@keyframes turn{to{transform:rotate(360deg)}}@media(max-width:650px){.cards{grid-template-columns:1fr}}</style>
<h1>LLM Market Lab</h1><p>共享看板：统计结果和结论随已完成实验自动更新。</p><section><h2>最新实验结果 · 自动同步</h2>
<p>本页面供朋友查看结果。实验由项目主人的本地控制台运行，完成后自动发布到这里。</p>
<p id='sharedStatus'>正在读取最新结果…</p><p><a href='https://github.com/LiuSigan/llm-market-simulation'>项目代码（私有仓库需访问权限）</a> · <a href='single-run.html'>早期单次实验看板</a></p>
</section><section><h2>组间统计</h2><div id='cards' class='cards'>尚无实验结果。</div></section><section><h2>LLM 实验结论</h2><pre id='conclusionText'>—</pre></section><section><details><summary>查看 / 下载原始汇总数据</summary><a href='latest.json' download>下载 JSON</a><pre id='raw'></pre></details></section><script>
const $=id=>document.getElementById(id);
const labels={final_price:'最终价格',mean_abs_mispricing:'价格偏离',price_volatility:'波动率',total_turnover:'交易额'};
function value(key,x){return (x*(key==='mean_abs_mispricing'||key==='price_volatility'?100:1)).toFixed(3)+(key==='mean_abs_mispricing'||key==='price_volatility'?'%':'')}
function stat(key,v){return `${value(key,v.mean)} ± ${value(key,v.std)}<br><small>95% CI：${v.ci95?v.ci95.map(x=>value(key,x)).join(' 至 '):'至少需要 2 次运行'}</small>`}
function show(d){if(!d.groups)return;$('cards').innerHTML=Object.entries(d.groups).map(([name,metrics])=>`<div class='card'><b>${name} · ${d.runs_per_group[name]} 次</b>${Object.entries(metrics).map(([key,v])=>`<p>${labels[key]||key.replace('_pnl',' PnL')}<br>${stat(key,v)}</p>`).join('')}</div>`).join('')+(d.paired_differences?`<div class='card'><b>配对差值：LLM − baseline</b>${Object.entries(d.paired_differences).map(([key,v])=>`<p>${labels[key]||key.replace('_pnl',' PnL')} · ${v.n} 对<br>${stat(key,v)}</p>`).join('')}</div>`:'');$('conclusionText').textContent=d.conclusion||'未生成结论。'}

let previous=null;
async function refresh(){try{const r=await fetch('latest.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(previous!==d.published_at){show(d);$('raw').textContent=JSON.stringify(d,null,2);previous=d.published_at;}$('sharedStatus').textContent='实验 '+d.experiment_id+' · '+d.rounds+' 轮 · 发布于 '+new Date(d.published_at).toLocaleString()+' · 每 30 秒检查更新';}catch(e){$('sharedStatus').textContent='暂时无法检查更新，稍后自动重试。'}finally{setTimeout(refresh,30000)}}refresh();
</script></html>
